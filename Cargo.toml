[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SecurityTrip/Birchpad"
authors = ["The Birchpad Contributors"]

[workspace.dependencies]
# The grammars, at one version for the application's table and for `birchpad-grammars`,
# whose library must answer with the same tree-sitter ABI.
tree-sitter = "0.27"
tree-sitter-asm = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-batch = "0.11"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cmake = "0.7"
tree-sitter-containerfile = "0.9"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.3"
tree-sitter-diff = "0.1"
tree-sitter-elixir = "0.3"
tree-sitter-erlang = "0.21"
tree-sitter-go = "0.25"
tree-sitter-graphql = "0.3"
tree-sitter-groovy = "0.1"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-ini = "1.4"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-jsdoc = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nginx = "1.0"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-pascal = "0.10"
tree-sitter-powershell = "0.26"
tree-sitter-properties = "0.3"
tree-sitter-proto = "0.6"
tree-sitter-python = "0.25"
tree-sitter-r = "1.3"
tree-sitter-regex = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-solidity = "1.2"
tree-sitter-svelte-ng = "1.0"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"
birchpad-cli = { path = "crates/cli", version = "0.7.1" }
birchpad-commands = { path = "crates/commands", version = "0.8.0" }
birchpad-config = { path = "crates/config", version = "0.9.0" }
birchpad-core = { path = "crates/core", version = "0.7.6" }
birchpad-editor = { path = "crates/editor", version = "0.10.0" }
birchpad-i18n = { path = "crates/i18n", version = "0.9.0" }
birchpad-git = { path = "crates/git", version = "0.8.0" }
birchpad-io = { path = "crates/io", version = "0.7.0" }
birchpad-lsp = { path = "crates/lsp", version = "0.8.0" }
birchpad-menu-bar = { path = "crates/menu-bar", version = "0.5.0" }
birchpad-plugin = { path = "crates/plugin", version = "0.7.6" }
birchpad-print-dialog = { path = "crates/print-dialog", version = "0.7.5" }
birchpad-quick-pick = { path = "crates/quick-pick", version = "0.7.5" }
birchpad-search-results = { path = "crates/search-results", version = "0.8.0" }
birchpad-syntax = { path = "crates/syntax", version = "0.11.0" }
birchpad-terminal = { path = "crates/terminal", version = "0.8.0" }
birchpad-theme = { path = "crates/theme", version = "0.8.0" }
birchpad-tools = { path = "crates/tools", version = "0.7.6" }
birchpad-tray = { path = "crates/tray", version = "0.7.5" }
birchpad-tree-sitter-plantuml = { path = "crates/tree-sitter-plantuml", version = "0.7.7" }
birchpad-ui = { path = "crates/ui", version = "0.7.5" }
birchpad-update = { path = "crates/update", version = "0.9.0" }
birchpad-view = { path = "crates/view", version = "0.7.1" }

anyhow = "1"
proptest = "1.11"
ropey = { version = "=2.0.0-beta.1", features = ["metric_utf16", "metric_lines_lf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The version GPUI uses, so that one copy is built (`.github/dependabot.yml` holds it).
similar = { version = "2.7", default-features = false }
smallvec = "1.15"
thiserror = "2"
toml = "1.1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# The dependencies (GPUI, its layout and text, tree-sitter, wasmtime) optimized in debug builds:
# the window's tests and a debug run of the application spend most of their time in them, and
# they are built once while the workspace's crates still build quickly.
[profile.dev.package."*"]
opt-level = 1
