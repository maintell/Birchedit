[package]
name = "birchpad-grammars"
description = "Birchpad's tree-sitter grammars in a library of their own, loaded at run time (ADR 0070). No UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# A library the application loads; no crate links it, the executable asks for it at run time.
crate-type = ["cdylib"]

